    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.wavedefense]]
    modId="mmorpg"
    mandatory=false
    versionRange="[6.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.wavedefense]]
    modId="tacz"
    mandatory=false
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"
