modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
issueTrackerURL="https://github.com/gunfigterarusil/wave-defense-mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Wave Defense ${mod_version} - PvE/PvP arena engine for Minecraft 1.20.1 Forge.

Build configurable arena locations with mob waves, team PvP, shops, loot events,
portals, boundaries, HUD panels, and full in-game admin editors.
No config files needed — everything is configured through in-game GUI screens.

v0.2.51: server-tick crash isolation, Leave Location key changed to G (was L),
location import confirmation dialog, info button on player menu rows,
surrender button now visually distinct from Exit PvP, minimum player count hint
in team-select screen, and C→S packet rate limiter for DoS protection.

PvE features:
- Wave-defense locations: configurable mobs, equipment, potion effects, spawn points,
  starting items, completion rewards, points per kill, wave scaling.
- Shop system: global or per-point mode, multiple items per entry, buy/sell prices,
  NBT-aware sell matching, availability triggers, import/export.
- Loot spawn points with configurable triggers.
- Auto-activation zone, location boundary (timer/damage/teleport/surrender modes),
  portal system for penalty waves, info panel TextDisplays.
- HUD overlay: wave counter, timer, mob count, points, teammates.
- 30-second grace period when the last player leaves mid-wave.

PvP features:
- Standard rounds (buy phase → countdown → active → round end).
- Deathmatch: unlimited respawns, victory by kill target.
- Battle Royale: random spawn, shrinking border, border damage and particles.
- Capture the Point (CtP): teams capture and hold multiple named points; score per
  second per owned point; first-to-score or timer-based win condition.
- King of the Hill (KotH): same mechanic on a single contested hill point.
- Capture points: in-game editor per location, configurable radius, capture time,
  particles; contested-point freeze when both teams stand on a point simultaneously.
- Team spawns, auto-balance, friendly fire, scoreboard nametag hiding, per-round points.
- PvP↔PvE mode switch requires two-click confirmation (no accidental resets).

Persistent Leaderboard:
- Per-location, per-mode top-10 records (PvE: waves + score; DM/BR: kills + KD;
  CtP/KotH: objective score + kills).
- Leaderboard button in the player main menu (visible when outside any active location).
- Data persists in <world>/data/wavedefense_leaderboards.dat across server restarts.

Mine and Slash compatibility (optional, mmorpg mod v6.1.0+):
- When Mine and Slash is installed, each PvE location gains extra fields:
  mob level, XP drop bonus, and 5 elemental resistances (fire/water/lightning/chaos/physical).
- Fully optional — the mod works normally without Mine and Slash.

Languages: EN · UK · DE · FR · ES · PL · PT-BR · ZH-CN

Hotkeys:  V — main menu   |   B — open shop   |   G — leave location

Configuration: Mods menu → Wave Defense → Config  (or edit config/wavedefense-common.toml)
'''
logoFile="logo.png"
authors="${mod_authors}"
credits="Thanks to the Minecraft Forge team. Special thanks to tester KatkovB."
displayURL="https://github.com/gunfigterarusil/wave-defense-mod"

[[dependencies.wavedefense]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.wavedefense]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.wavedefense]]
    modId="mmorpg"
    mandatory=false
    versionRange="[6.1.0,)"
    ordering="NONE"
    side="BOTH"
