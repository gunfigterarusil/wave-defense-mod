modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
issueTrackerURL="https://github.com/gunfigterarusil/wave-defense-mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Wave Defense ${mod_version} - PvE/PvP arena engine for Minecraft 1.20.1 Forge.

This version is a repair and UI-improvement branch after the public 0.2.42 release.

Main features:
- PvE wave-defense locations with configurable mobs, equipment, effects, spawn points, rewards, shops, loot, boundaries, portals, and info panels.
- PvP locations with team spawns, Standard rounds, Deathmatch, Battle Royale, buy phase, team auto-balance, friendly fire, points, and scoreboard/HUD sync.
- In-game admin editors for locations, waves, mobs, shops, loot spawns, triggers, PvP rules, and HUD settings.
- Player HUD, teammate panel, direct shop hotkey, import/export, and NBT-backed persistence.

0.2.43 focus:
- restore broken WaveManager/PvE/PvP logic from the repair branch;
- keep explicit PvP team selection stable when auto-balance is enabled;
- improve large GUI scrolling and hidden-widget click behavior;
- start the UI cleanup track for better location configuration and a future shop tile/grid mode.
'''
logoFile="logo.png"
authors="${mod_authors}"
credits="Thanks to the Minecraft Forge team. Special thanks to tester KatkovB."
displayURL="https://github.com/gunfigterarusil/wave-defense-mod"

[[dependencies.wavedefense]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.wavedefense]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
